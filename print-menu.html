<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Bistrot des Halles — Carte</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root { --burgundy:#601424; --cream:#fdfaf5; --taupe:#b2a48f; --dark:#2d2325; --muted:#6e5d60; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Inter',sans-serif; background:#fdfaf5; color:var(--dark); }

.toolbar { background:var(--burgundy); color:white; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:100; }
.toolbar-title { font-family:'Playfair Display',serif; font-size:1rem; }
.toolbar-right { display:flex; gap:8px; flex-wrap:wrap; }
.btn { border:none; padding:9px 18px; border-radius:6px; font-size:0.82rem; font-weight:700; cursor:pointer; }
.btn-print { background:#10b981; color:white; }
.btn-pdf { background:#f59e0b; color:white; }
.btn-pdf:disabled { background:#9ca3af; cursor:not-allowed; }

.selector { background:white; border-bottom:2px solid var(--cream); padding:14px 24px; display:none; gap:10px; flex-wrap:wrap; align-items:center; }
.selector-label { font-size:0.82rem; font-weight:700; color:var(--burgundy); margin-right:6px; }
.menu-chip { display:flex; align-items:center; gap:6px; background:#fdfaf5; border:1.5px solid var(--taupe); border-radius:20px; padding:6px 14px; cursor:pointer; font-size:0.8rem; font-weight:600; color:var(--burgundy); }
.menu-chip input { accent-color:var(--burgundy); }
.menu-chip:has(input:checked) { background:var(--burgundy); color:white; border-color:var(--burgundy); }

/* ZONE CAPTURÉE PAR html2canvas */
#capture-zone {
    background: #fdfaf5;
    width: 794px; /* A4 en pixels à 96dpi */
    margin: 0 auto;
    padding: 50px 50px 60px;
}

.carte-header { text-align:center; margin-bottom:40px; padding-bottom:20px; border-bottom:3px solid var(--burgundy); }
.carte-header h1 { font-family:'Playfair Display',serif; color:var(--burgundy); font-size:2.4rem; letter-spacing:4px; margin-bottom:6px; }
.carte-header p { font-size:0.85rem; color:var(--muted); font-style:italic; }

.menu-block { margin-bottom:60px; border-top:4px solid var(--burgundy); padding-top:40px; }
.menu-title { font-family:'Playfair Display',serif; background:var(--burgundy); color:white; font-size:1.05rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; padding:10px 16px; margin-bottom:18px; border-radius:3px; }
.cat-block { margin-bottom:16px; }
.cat-title { font-family:'Playfair Display',serif; color:var(--burgundy); font-size:0.82rem; font-weight:700; border-bottom:1px solid var(--taupe); padding-bottom:4px; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
.prod-row { display:flex; justify-content:space-between; align-items:flex-start; padding:6px 0 8px; border-bottom:1px solid #d4c9b0; gap:16px; }
.prod-left { flex:1; min-width:0; }
.prod-name { font-size:0.85rem; font-weight:600; color:var(--dark); }
.prod-desc { font-size:0.72rem; color:var(--muted); font-style:italic; margin-top:2px; line-height:1.4; }
.prod-price { font-weight:700; color:var(--burgundy); white-space:nowrap; font-size:0.85rem; flex-shrink:0; padding-top:1px; }

.loading { text-align:center; padding:60px; color:#9ca3af; font-style:italic; }
.pdf-progress { background:#1f2937; color:white; padding:12px 20px; border-radius:8px; margin:16px auto; max-width:400px; text-align:center; font-size:0.85rem; display:none; }

/* POPUP FORMAT PDF */
.pdf-popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; }
.pdf-popup-overlay.open { display:flex; }
.pdf-popup { background:white; border-radius:14px; padding:28px; width:320px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.pdf-popup h3 { font-family:'Playfair Display',serif; color:var(--burgundy); font-size:1.1rem; margin-bottom:6px; }
.pdf-popup p { font-size:0.78rem; color:#6b7280; margin-bottom:20px; }
.pdf-format-btn { display:flex; align-items:flex-start; gap:12px; padding:14px; border:2px solid #e5e7eb; border-radius:10px; cursor:pointer; margin-bottom:10px; transition:all 0.15s; background:white; width:100%; text-align:left; }
.pdf-format-btn:hover { border-color:var(--burgundy); background:#fdfaf5; }
.pdf-format-btn .icon { font-size:1.5rem; flex-shrink:0; }
.pdf-format-btn .label { font-weight:700; font-size:0.88rem; color:var(--dark); }
.pdf-format-btn .desc { font-size:0.75rem; color:#6b7280; margin-top:2px; }
.pdf-popup-cancel { width:100%; padding:10px; border:none; background:none; color:#9ca3af; font-size:0.82rem; cursor:pointer; margin-top:4px; }
.pdf-popup-cancel:hover { color:var(--dark); }
@media print {
    .toolbar, .selector, .pdf-progress { display:none !important; }
    body { background:#fdfaf5; }
    #capture-zone { width:100%; padding:20px; box-shadow:none; }
}
</style>
</head>
<body>

<div class="toolbar">
    <span class="toolbar-title">🖨️ Le Bistrot des Halles — Carte</span>
    <div class="toolbar-right">
        <button class="btn btn-print" onclick="window.print()">🖨️ Imprimer</button>
        <button class="btn btn-pdf" id="btn-pdf" onclick="showFormatPicker()">⬇️ Télécharger PDF</button>
    </div>
</div>

<div class="selector" id="selector">
    <span class="selector-label">Menus à inclure :</span>
    <div id="menu-checkboxes" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
</div>

<div class="pdf-progress" id="pdf-progress">⏳ Génération du PDF en cours...</div>

<!-- POPUP FORMAT PDF -->
<div class="pdf-popup-overlay" id="pdf-popup-overlay">
    <div class="pdf-popup">
        <h3>Choisir le format</h3>
        <p>Sélectionne le format du PDF à télécharger.</p>
        <button class="pdf-format-btn" onclick="selectFormat('pages')">
            <span class="icon">📄</span>
            <div>
                <div class="label">Par menu</div>
                <div class="desc">Une page par menu, en-tête répété. Idéal pour imprimer chaque menu séparément.</div>
            </div>
        </button>
        <button class="pdf-format-btn" onclick="selectFormat('compact')">
            <span class="icon">📋</span>
            <div>
                <div class="label">Version compacte — 3 pages</div>
                <div class="desc">Tous les menus condensés en 3 pages max avec police réduite.</div>
            </div>
        </button>
        <button class="pdf-popup-cancel" onclick="closeFormatPicker()">Annuler</button>
    </div>
</div>

<div id="capture-zone">
    <div id="menu-content"><div class="loading">Chargement de la carte...</div></div>
</div>

<script>
const db = supabase.createClient(
    'https://mvxqpysdbngyazzzdbkc.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12eHFweXNkYm5neWF6enpkYmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNTgyNzgsImV4cCI6MjA5NjkzNDI3OH0.Y0v4pHdGHF6oGMP4AbTyMjIAZLJk-S7iWL0p_SaRJAs'
);
let appState = null;

async function loadAndRender() {
    try {
        const { data, error } = await db.from('state').select('*').eq('key', 'app_state').maybeSingle();
        if (error || !data) { document.getElementById('menu-content').innerHTML = '<div class="loading">Erreur de chargement.</div>'; return; }
        appState = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;

        const box = document.getElementById('menu-checkboxes');
        appState.menus.forEach(m => {
            const label = document.createElement('label');
            label.className = 'menu-chip';
            const cb = document.createElement('input');
            cb.type = 'checkbox'; cb.value = m.id; cb.checked = true;
            cb.addEventListener('change', applySelection);
            label.appendChild(cb);
            label.appendChild(document.createTextNode(' ' + m.name));
            box.appendChild(label);
        });
        document.getElementById('selector').style.display = 'flex';
        renderMenus(appState.menus);
    } catch(e) {
        document.getElementById('menu-content').innerHTML = '<div class="loading">Erreur de chargement.</div>';
    }
}

function renderMenus(menus) {
    if (!appState) return;
    let html = '';
    menus.forEach(m => {
        const visibleCats = appState.categories.filter(c => c.menuId === m.id && appState.products.some(p => p.catId === c.id && !p.isHidden));
        if (!visibleCats.length) return;
        html += `<div class="menu-block" data-menu-id="${m.id}">
            <div class="carte-header">
                <h1>Le Bistrot des Halles</h1>
                <p>12 rue au Pain — Versailles &nbsp;·&nbsp; Notre sélection du moment</p>
            </div>
            <div class="menu-title">${m.name}</div>`;
        visibleCats.forEach(cat => {
            const prods = appState.products.filter(p => p.catId === cat.id && !p.isHidden);
            html += '<div class="cat-block"><div class="cat-title">' + cat.name + '</div>';
            prods.forEach(p => {
                html += '<div class="prod-row"><div class="prod-left"><div class="prod-name">' + p.name + '</div>';
                if (p.desc) html += '<div class="prod-desc">' + p.desc + '</div>';
                html += '</div><div class="prod-price">' + parseFloat(p.price).toFixed(2) + '\u202f\u20ac</div></div>';
            });
            html += '</div>';
        });
        html += '</div>';
    });
    document.getElementById('menu-content').innerHTML = html || '<div class="loading">Aucun article visible.</div>';
}

function applySelection() {
    const checked = Array.from(document.querySelectorAll('#menu-checkboxes input:checked')).map(i => i.value);
    const selected = appState ? appState.menus.filter(m => checked.includes(m.id)) : [];
    renderMenus(selected.length ? selected : (appState ? appState.menus : []));
}

function showFormatPicker() {
    document.getElementById('pdf-popup-overlay').classList.add('open');
}

function closeFormatPicker() {
    document.getElementById('pdf-popup-overlay').classList.remove('open');
}

function selectFormat(format) {
    closeFormatPicker();
    if (format === 'compact') {
        downloadPDFCompact();
    } else {
        downloadPDF();
    }
}

async function downloadPDF() {
    if (!appState) return alert('Carte en chargement, réessayez.');
    const btn = document.getElementById('btn-pdf');
    const progress = document.getElementById('pdf-progress');
    btn.disabled = true;
    btn.textContent = '⏳ En cours...';
    progress.style.display = 'block';

    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:794px;height:2000px;border:none;visibility:hidden;';
    document.body.appendChild(iframe);
    await new Promise(r => setTimeout(r, 200));

    const idoc = iframe.contentDocument;
    idoc.open();
    idoc.write(`<!DOCTYPE html><html><head>
        <meta charset="UTF-8">
        <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Georgia,serif; background:#fdfaf5; color:#2d2325; width:794px; }
        .page { width:794px; padding:20px 50px; background:#fdfaf5; }
        .mini-header { text-align:center; padding-bottom:10px; border-bottom:2px solid #601424; margin-bottom:10px; }
        .mini-header h1 { font-family:Georgia,serif; color:#601424; font-size:1.5rem; letter-spacing:3px; }
        .mini-header p { font-size:0.7rem; color:#6e5d60; font-style:italic; margin-top:2px; }
        .menu-title { font-family:Georgia,serif; background:#601424; color:white; font-size:0.95rem; font-weight:700; text-transform:uppercase; letter-spacing:2px; padding:8px 14px; margin-bottom:10px; }
        .cont-title { font-family:Georgia,serif; background:#8a2030; color:white; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:5px 14px; margin-bottom:10px; font-style:italic; }
        .cat-block { margin-bottom:10px; }
        .cat-title { color:#601424; font-size:0.75rem; font-weight:700; border-bottom:1px solid #b2a48f; padding-bottom:3px; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
        .prod-row { display:flex; justify-content:space-between; align-items:flex-start; padding:4px 0 5px; border-bottom:1px solid #d4c9b0; gap:12px; }
        .prod-left { flex:1; min-width:0; }
        .prod-name { font-size:0.8rem; font-weight:600; color:#2d2325; }
        .prod-desc { font-size:0.67rem; color:#6e5d60; font-style:italic; margin-top:1px; line-height:1.3; }
        .prod-price { font-weight:700; color:#601424; white-space:nowrap; font-size:0.8rem; flex-shrink:0; }
        </style></head><body></body></html>`);
    idoc.close();
    await new Promise(r => setTimeout(r, 800));

    const cap = async (el) => {
        await new Promise(r => setTimeout(r, 150));
        return html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#fdfaf5', logging: false, allowTaint: true });
    };

    const A4_PX = 1123;

    const buildPage = (menuName, catsHTML, isContinu) => `
        <div class="page" id="pg">
            <div class="mini-header">
                <h1>Le Bistrot des Halles</h1>
                <p>12 rue au Pain — Versailles</p>
            </div>
            <div class="${isContinu ? 'cont-title' : 'menu-title'}">${menuName}${isContinu ? ' (suite)' : ''}</div>
            ${catsHTML}
        </div>`;

    const flushPage = async (doc, menuName, catsHTML, isContinu, firstPage) => {
        if (!firstPage) doc.addPage();
        doc.setFillColor(253, 250, 245);
        doc.rect(0, 0, 210, 297, 'F');
        idoc.body.innerHTML = buildPage(menuName, catsHTML, isContinu);
        await new Promise(r => setTimeout(r, 150));
        const pg = idoc.getElementById('pg');
        const canvas = await cap(pg);
        const imgH = (canvas.height * 210) / canvas.width;
        doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, imgH);
        idoc.body.innerHTML = '';
        return false; // firstPage devient false après
    };

    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
        const checked = Array.from(document.querySelectorAll('#menu-checkboxes input:checked')).map(i => i.value);
        const selectedMenus = appState.menus.filter(m => checked.includes(m.id));
        let firstPage = true;

        for (const menu of selectedMenus) {
            const cats = appState.categories.filter(c => c.menuId === menu.id);
            const visibleCats = cats.filter(cat => appState.products.some(p => p.catId === cat.id && !p.isHidden));
            if (!visibleCats.length) continue;

            // Générer HTML de chaque catégorie
            const allCatsHTML = visibleCats.map(cat => {
                const prods = appState.products.filter(p => p.catId === cat.id && !p.isHidden);
                let h = `<div class="cat-block"><div class="cat-title">${cat.name}</div>`;
                prods.forEach(p => {
                    h += `<div class="prod-row">
                        <div class="prod-left">
                            <div class="prod-name">${p.name}</div>
                            ${p.desc ? `<div class="prod-desc">${p.desc}</div>` : ''}
                        </div>
                        <div class="prod-price">${parseFloat(p.price).toFixed(2)} €</div>
                    </div>`;
                });
                return h + '</div>';
            });

            let currentHTML = '';
            let isContinu = false;

            for (let ci = 0; ci < allCatsHTML.length; ci++) {
                const testHTML = currentHTML + allCatsHTML[ci];

                // Tester si ça tient
                idoc.body.innerHTML = buildPage(menu.name, testHTML, isContinu);
                await new Promise(r => setTimeout(r, 120));
                const pg = idoc.getElementById('pg');

                if (pg.offsetHeight > A4_PX && currentHTML !== '') {
                    // Flusher page courante sans la catégorie actuelle
                    firstPage = await flushPage(doc, menu.name, currentHTML, isContinu, firstPage);
                    currentHTML = allCatsHTML[ci];
                    isContinu = true;
                } else {
                    currentHTML = testHTML;
                }
            }

            // Flusher la dernière page
            if (currentHTML) {
                firstPage = await flushPage(doc, menu.name, currentHTML, isContinu, firstPage);
            }
        }

        doc.save('bistrot-des-halles-carte.pdf');
    } catch(e) {
        alert('Erreur : ' + e.message);
    } finally {
        document.body.removeChild(iframe);
        btn.disabled = false;
        btn.textContent = '⬇️ Télécharger PDF';
        progress.style.display = 'none';
    }
}

        document.body.removeChild(iframe);
        btn.disabled = false;
        btn.textContent = '⬇️ Télécharger PDF';
        progress.style.display = 'none';
    }
}


loadAndRender();
</script>
</body>
